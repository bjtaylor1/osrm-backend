[supervisord]
nodaemon=true
logfile=/opt/osrm/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[group:osrm]
programs=osrm_a,osrm_b,osrm_c,osrm_d,osrm_e,osrm_f

[program:osrm_a]
command=/usr/local/bin/osrm-routed /opt/osrm/data/a_north_america.osrm --ip 127.0.0.1 --port 5000 --threads 2 --max-table-size 10000
directory=/opt/osrm
autostart=true
autorestart=true
startsecs=10
startretries=3
stderr_logfile=/opt/osrm/logs/a.err.log
stdout_logfile=/opt/osrm/logs/a.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
user=root
priority=100

[program:osrm_b]
